<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Checklist — Wondergift88</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--wine:#6B1A2A;--wine-light:#9B3A4A;--wine-pale:#F5EEE9;--gold:#C4A25A;--cream:#FAF6F0;--dark:#2A1A14;--mid:#7A6055;--light:#D4C4BA;--white:#fff;--green:#3A6B45;--green-pale:#EAF3EC;--red:#C0392B;--red-pale:#FDECEA;--blue:#1A5276;--blue-pale:#EAF2F8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh}

/* HEADER */
.header{background:var(--wine);padding:1.25rem 2rem 0;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;border:40px solid rgba(196,162,90,0.12)}
.brand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#E8D5A3;margin-bottom:3px}
.header-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.header h1{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#fff;line-height:1.2}
.header-sub{font-size:11px;font-weight:300;color:rgba(255,255,255,0.5);margin-top:1px}

/* TABS */
.tabs{display:flex;gap:0;margin-top:14px}
.tab{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:9px 20px;border:none;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);cursor:pointer;border-radius:8px 8px 0 0;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab.active{background:#fff;color:var(--wine)}
.tab:hover:not(.active){background:rgba(255,255,255,0.18);color:rgba(255,255,255,0.9)}
.tab-badge{background:var(--wine-light);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.tab.active .tab-badge{background:var(--wine);color:#fff}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--light);padding:10px 2rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.prog-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:100px}
.prog-bar{flex:1;max-width:180px;height:5px;background:var(--light);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--wine),var(--wine-light));border-radius:3px;transition:width .35s}
.prog-text{font-size:12px;color:var(--mid);white-space:nowrap}
.prog-text strong{color:var(--dark)}
.topbar-btns{display:flex;gap:7px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:7px 13px;border-radius:6px;cursor:pointer;transition:all .2s;white-space:nowrap;border:1px solid var(--light);background:#fff;color:var(--mid)}
.btn:hover{border-color:var(--mid);color:var(--dark)}
.btn.primary{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.primary:hover{background:var(--wine-light)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.green:hover{background:#2D5A38}
.btn svg{flex-shrink:0}

/* CUSTOMER BAR */
.customer-bar{background:var(--wine-pale);border-bottom:1px solid #E8DDD6;padding:9px 2rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.customer-bar label{font-size:12px;color:var(--mid);white-space:nowrap}
.customer-bar input{flex:1;max-width:300px;font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 11px;border:1px solid #E8DDD6;border-radius:6px;background:#fff;color:var(--dark);outline:none;transition:border-color .2s}
.customer-bar input:focus{border-color:var(--wine)}
.customer-bar input::placeholder{color:var(--light)}

/* DONE BANNER */
.done-banner{display:none;margin:1rem 2rem 0;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--green-pale);border:1px solid #B8D9BF;border-radius:10px;flex-wrap:wrap}
.done-banner.show{display:flex}
.done-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--green)}
.done-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-save-hist{display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;background:#fff;color:var(--green);border:1.5px solid var(--green);border-radius:6px;cursor:pointer;transition:all .2s}
.btn-save-hist:hover{background:var(--green-pale)}
.btn-pdf-main{display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;transition:background .2s}
.btn-pdf-main:hover{background:#2D5A38}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* MAIN */
.main{padding:1.25rem 2rem 3rem;max-width:700px;margin:0 auto}

/* SECTION */
.section{background:#fff;border:1px solid #E8DDD6;border-radius:12px;margin-bottom:.875rem;overflow:hidden;transition:box-shadow .2s}
.section:hover{box-shadow:0 2px 12px rgba(107,26,42,0.07)}
.sec-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;gap:8px}
.sec-left{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.sec-icon{font-size:16px;flex-shrink:0}
.sec-name{font-size:13px;font-weight:500;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-count{font-size:11px;color:var(--mid);background:var(--cream);border:1px solid #E8DDD6;padding:2px 8px;border-radius:20px;flex-shrink:0}
.sec-chevron{font-size:13px;color:var(--light);transition:transform .25s;flex-shrink:0}
.sec-chevron.open{transform:rotate(180deg)}
.sec-prog{height:2px;background:var(--cream)}
.sec-prog-fill{height:100%;background:var(--gold);transition:width .35s}
.sec-body{display:none;padding:4px 16px 12px}
.sec-body.open{display:block}
.items{list-style:none}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--cream)}
.item:last-child{border-bottom:none}
.item.checked{opacity:.55}
.item.checked .item-label{text-decoration:line-through;color:var(--mid)}
.checkbox{width:20px;height:20px;border:1.5px solid var(--light);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;background:#fff}
.checkbox:hover{border-color:var(--wine-light)}
.checkbox.checked{background:var(--wine);border-color:var(--wine)}
.checkbox svg{width:11px;height:11px;stroke:transparent;stroke-width:2.5;fill:none;transition:stroke .1s}
.checkbox.checked svg{stroke:#fff}
.item-text{flex:1}
.item-label{font-size:13px;color:var(--dark);line-height:1.4}
.item-sub{font-size:11px;color:var(--mid);margin-top:2px}
.del-btn{background:none;border:none;cursor:pointer;color:var(--light);padding:2px 4px;border-radius:4px;transition:color .15s;margin-top:1px;flex-shrink:0;display:flex;align-items:center}
.del-btn:hover{color:var(--red)}
.add-row{display:flex;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed #E8DDD6}
.add-row input{flex:1;font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 10px;border:1px solid #E8DDD6;border-radius:6px;background:var(--cream);color:var(--dark);outline:none;transition:border-color .2s}
.add-row input:focus{border-color:var(--wine);background:#fff}
.add-row input::placeholder{color:var(--light)}
.add-row button{font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 12px;border:1px solid #E8DDD6;border-radius:6px;background:#fff;color:var(--mid);cursor:pointer;transition:all .15s;white-space:nowrap}
.add-row button:hover{border-color:var(--wine);color:var(--wine)}

/* HISTORY PAGE */
.hist-main{padding:1.25rem 2rem 3rem;max-width:700px;margin:0 auto}
.hist-empty{text-align:center;padding:4rem 2rem;color:var(--mid)}
.hist-empty svg{margin-bottom:12px;opacity:.35}
.hist-empty p{font-size:14px}
.hist-empty small{font-size:12px;color:var(--light);display:block;margin-top:6px}
.hist-card{background:#fff;border:1px solid #E8DDD6;border-radius:12px;margin-bottom:.875rem;overflow:hidden;transition:box-shadow .2s}
.hist-card:hover{box-shadow:0 2px 12px rgba(107,26,42,0.07)}
.hist-card-header{display:flex;align-items:center;gap:12px;padding:14px 16px}
.hist-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hist-status-dot.complete{background:var(--green)}
.hist-status-dot.partial{background:var(--gold)}
.hist-info{flex:1;min-width:0}
.hist-customer{font-size:14px;font-weight:500;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-meta{font-size:11px;color:var(--mid);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.hist-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.hist-badge.complete{background:var(--green-pale);color:var(--green)}
.hist-badge.partial{background:#FEF9E7;color:#B7770D}
.hist-actions{display:flex;gap:7px;flex-shrink:0}
.hist-btn{display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:11px;padding:6px 11px;border-radius:6px;cursor:pointer;border:1px solid #E8DDD6;background:#fff;color:var(--mid);transition:all .15s;white-space:nowrap}
.hist-btn:hover{border-color:var(--mid);color:var(--dark)}
.hist-btn.dl{background:var(--wine);color:#fff;border-color:var(--wine)}
.hist-btn.dl:hover{background:var(--wine-light)}
.hist-btn.danger:hover{border-color:var(--red);color:var(--red)}
.hist-divider{height:1px;background:var(--cream);margin:0 16px}
.hist-preview{padding:12px 16px;display:none}
.hist-preview.open{display:block}
.hist-preview-sec{margin-bottom:10px}
.hist-preview-sec-name{font-size:11px;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.hist-preview-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--dark)}
.hist-preview-item.checked{color:var(--mid)}
.hist-preview-item.checked span{text-decoration:line-through}
.hist-check-icon{width:14px;height:14px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hist-check-icon.done{background:var(--wine)}
.hist-check-icon.done svg{stroke:#fff}
.hist-check-icon.undone{border:1.5px solid var(--light)}
.hist-check-icon svg{width:8px;height:8px;stroke:transparent;stroke-width:2.5;fill:none}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(42,26,20,0.55);z-index:100;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:580px;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.2);margin:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid #E8DDD6;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-header h2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--dark)}
.modal-header p{font-size:11px;color:var(--mid);margin-top:3px;line-height:1.5}
.modal-close{background:none;border:none;cursor:pointer;color:var(--mid);font-size:20px;line-height:1;padding:2px;flex-shrink:0}
.modal-close:hover{color:var(--dark)}
.modal-body{padding:16px 20px;overflow-y:auto;max-height:65vh}
.modal-footer{padding:12px 20px;border-top:1px solid #E8DDD6;display:flex;gap:8px;justify-content:flex-end}

/* TEMPLATE EDITOR */
.tpl-section-block{border:1px solid #E8DDD6;border-radius:10px;margin-bottom:12px;overflow:hidden}
.tpl-sec-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--wine-pale);border-bottom:1px solid #E8DDD6}
.tpl-sec-icon-input{width:36px;font-size:16px;text-align:center;border:1px solid #E8DDD6;border-radius:6px;padding:4px;background:#fff;outline:none;font-family:'DM Sans',sans-serif}
.tpl-sec-name-input{flex:1;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:5px 9px;border:1px solid #E8DDD6;border-radius:6px;background:#fff;color:var(--dark);outline:none}
.tpl-sec-name-input:focus{border-color:var(--wine)}
.tpl-del-sec{background:#fff;border:1px solid #E8DDD6;border-radius:6px;cursor:pointer;color:var(--light);padding:5px 8px;display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;font-size:11px;transition:all .15s;white-space:nowrap}
.tpl-del-sec:hover{border-color:var(--red);color:var(--red)}
.tpl-items-list{padding:8px 14px;list-style:none}
.tpl-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--cream)}
.tpl-item:last-child{border-bottom:none}
.tpl-item-label{flex:1;font-size:13px;color:var(--dark)}
.tpl-del-item{background:none;border:none;cursor:pointer;color:var(--light);transition:color .15s;display:flex;align-items:center;padding:2px}
.tpl-del-item:hover{color:var(--red)}
.tpl-add{display:flex;gap:7px;padding:8px 14px;border-top:1px dashed #E8DDD6;background:var(--cream)}
.tpl-add input{flex:1;font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 10px;border:1px solid #E8DDD6;border-radius:6px;background:#fff;color:var(--dark);outline:none}
.tpl-add input:focus{border-color:var(--wine)}
.tpl-add input::placeholder{color:var(--light)}
.tpl-add button{font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;border:1px solid #E8DDD6;border-radius:6px;background:#fff;color:var(--mid);cursor:pointer;white-space:nowrap;transition:all .15s}
.tpl-add button:hover{border-color:var(--wine);color:var(--wine)}
.add-section-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1.5px dashed #E8DDD6;border-radius:10px;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--mid);cursor:pointer;transition:all .2s;margin-top:4px}
.add-section-btn:hover{border-color:var(--wine);color:var(--wine)}

.footer{text-align:center;padding:.75rem 2rem 2rem;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--light);font-style:italic}

@media(max-width:540px){
  .hist-card-header{flex-wrap:wrap}
  .hist-actions{width:100%;justify-content:flex-end}
  .header h1{font-size:20px}
  .done-actions{width:100%}
}
@media print{
  .topbar,.customer-bar,.topbar-btns,.add-row,.del-btn,.done-banner,.tabs{display:none!important}
  .sec-body{display:block!important}
  body{background:#fff}
  .section{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">Wondergift88</div>
  <div class="header-title-row">
    <div>
      <h1>QC Checklist Hampers</h1>
      <div class="header-sub">Quality Control — Standar Produksi</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showPage('checklist',this)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Checklist QC
    </button>
    <button class="tab" onclick="showPage('history',this)" id="histTab">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
      <span class="tab-badge" id="histBadge">0</span>
    </button>
  </div>
</div>

<!-- CHECKLIST PAGE -->
<div class="page active" id="page-checklist">
  <div class="topbar">
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-text" id="progText"><strong>0</strong> / 0 item</div>
    </div>
    <div class="topbar-btns">
      <button class="btn" onclick="openTemplate()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Setting Template
      </button>
      <button class="btn" onclick="window.print()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
      <button class="btn primary" onclick="resetAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        QC Baru
      </button>
    </div>
  </div>

  <div class="customer-bar">
    <label for="custName">Nama Customer:</label>
    <input type="text" id="custName" placeholder="Isi nama customer...">
  </div>

  <div class="done-banner" id="doneBanner">
    <div class="done-left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Semua item lolos QC — siap dikemas!
    </div>
    <div class="done-actions">
      <button class="btn-save-hist" onclick="saveToHistory()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Simpan ke History
      </button>
      <button class="btn-pdf-main" onclick="generatePDF(null)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Download PDF
      </button>
    </div>
  </div>

  <div class="main" id="main"></div>
  <div class="footer">Wondergift88 &nbsp;·&nbsp; Dokumen Produksi Internal</div>
</div>

<!-- HISTORY PAGE -->
<div class="page" id="page-history">
  <div class="hist-main" id="histMain"></div>
</div>

<!-- TEMPLATE MODAL -->
<div class="overlay" id="tplOverlay" onclick="if(event.target===this)closeTemplate()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2>Setting Template QC</h2>
        <p>Atur seksi & item pakem. Aktif setiap "QC Baru" ditekan.</p>
      </div>
      <button class="modal-close" onclick="closeTemplate()">✕</button>
    </div>
    <div class="modal-body" id="tplBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeTemplate()">Batal</button>
      <button class="btn primary" onclick="saveTemplate()">Simpan Template</button>
    </div>
  </div>
</div>

<script>
const ICONS=['📦','✨','👁','🌸','🎀','🎁','📋','⭐','🔍','💎','🧴','🕯️'];

const DEFAULT_TEMPLATE=[
  {id:'pkg',icon:'📦',name:'Packaging Utama',items:[
    {id:'p1',label:'Box / packaging utama',sub:'Cek ukuran sesuai model'},
    {id:'p2',label:'Kertas wrapping',sub:'Lapisan pertama pembungkus'},
    {id:'p3',label:'Lapisan tambahan dekoratif',sub:'Tissue paper, lapisan dekoratif'},
    {id:'p4',label:'Sponge / foam',sub:'Alas & penyangga dalam box'},
    {id:'p5',label:'Cling wrap untuk sponge',sub:'Bungkus sponge agar rapi'},
    {id:'p6',label:'Cek posisi botol',sub:'Pastikan botol tidak goyang'},
    {id:'p7',label:'Cek kestabilan semua isi',sub:'Semua item tidak bergeser'},
    {id:'p8',label:'Lidi / penyangga — kekuatan',sub:'Uji kekuatan sebelum packing'},
    {id:'p9',label:'Lidi / penyangga — posisi & finishing',sub:'Posisi rapi & tidak terlihat'},
  ]},
  {id:'acc',icon:'✨',name:'Aksesoris Hampers',items:[
    {id:'a1',label:'Greeting card',sub:'Wajib ada di setiap hampers'},
    {id:'a2',label:'Topper akrilik sesuai event',sub:'Birthday / Anniversary / dll'},
    {id:'a3',label:'Lilin ulang tahun',sub:'Khusus tema birthday'},
    {id:'a4',label:'Pita / ribbon',sub:'Warna sesuai tema'},
    {id:'a5',label:'Voucher / kartu diskon',sub:'Jika ada promo — optional'},
    {id:'a6',label:'Spoon bag',sub:'Optional — cek per order'},
  ]},
  {id:'qcv',icon:'👁',name:'Quality Check Visual',items:[
    {id:'q1',label:'Tampilan dari depan',sub:'Rapi, simetris, tidak ada yang miring'},
    {id:'q2',label:'Tampilan dari samping & atas',sub:''},
    {id:'q3',label:'Tidak ada kotoran / noda',sub:'Bersihkan sebelum wrap final'},
    {id:'q4',label:'Wrapping / seal penutup akhir',sub:'Plastik wrap atau ribbon seal'},
  ]}
];

function loadTemplate(){try{const s=localStorage.getItem('wg_tpl_v3');return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_TEMPLATE))}catch(e){return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE))}}
function saveTplStorage(t){try{localStorage.setItem('wg_tpl_v3',JSON.stringify(t))}catch(e){}}
function loadHistory(){try{const s=localStorage.getItem('wg_hist_v1');return s?JSON.parse(s):[]}catch(e){return[]}}
function saveHistStorage(h){try{localStorage.setItem('wg_hist_v1',JSON.stringify(h))}catch(e){}}

let template=loadTemplate();
let sections=JSON.parse(JSON.stringify(template));
let checked={};
let history=loadHistory();
let tplDraft=null;
let currentPage='checklist';

// ── TABS ─────────────────────────────
function showPage(page,tabEl){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  tabEl.classList.add('active');
  currentPage=page;
  if(page==='history') renderHistory();
}

// ── PROGRESS ─────────────────────────
function totalItems(){return sections.reduce((s,sec)=>s+sec.items.length,0)}
function totalChecked(){return sections.reduce((s,sec)=>s+sec.items.filter(i=>checked[i.id]).length,0)}

function updateProgress(){
  const tot=totalItems(),don=totalChecked();
  const pct=tot?Math.round(don/tot*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').innerHTML=`<strong>${don}</strong> / ${tot} item`;
  document.getElementById('doneBanner').className='done-banner'+(tot>0&&don===tot?' show':'');
}

function updateSecProgress(secId){
  const sec=sections.find(s=>s.id===secId);if(!sec)return;
  const tot=sec.items.length,don=sec.items.filter(i=>checked[i.id]).length;
  const el=document.getElementById('sec-'+secId);if(!el)return;
  el.querySelector('.sec-count').textContent=`${don}/${tot}`;
  el.querySelector('.sec-prog-fill').style.width=(tot?Math.round(don/tot*100):0)+'%';
}

// ── CHECKLIST ────────────────────────
function toggleItem(itemId,secId){
  checked[itemId]=!checked[itemId];
  const el=document.getElementById('item-'+itemId);
  const isC=checked[itemId];
  el.className='item'+(isC?' checked':'');
  el.querySelector('.checkbox').className='checkbox'+(isC?' checked':'');
  updateSecProgress(secId);updateProgress();
}

function toggleSec(secId){
  const sec=sections.find(s=>s.id===secId);sec.open=!sec.open;
  const el=document.getElementById('sec-'+secId);
  el.querySelector('.sec-body').className='sec-body'+(sec.open?' open':'');
  el.querySelector('.sec-chevron').className='sec-chevron'+(sec.open?' open':'');
}

function addItem(secId){
  const inp=document.getElementById('inp-'+secId);
  const label=inp.value.trim();if(!label)return;
  const sec=sections.find(s=>s.id===secId);
  const newId=secId+'_'+Date.now();
  sec.items.push({id:newId,label,sub:''});
  document.getElementById('list-'+secId).appendChild(makeItemEl({id:newId,label,sub:''},secId));
  inp.value='';updateSecProgress(secId);updateProgress();inp.focus();
}

function deleteItem(itemId,secId){
  const sec=sections.find(s=>s.id===secId);
  sec.items=sec.items.filter(i=>i.id!==itemId);
  delete checked[itemId];
  document.getElementById('item-'+itemId)?.remove();
  updateSecProgress(secId);updateProgress();
}

function resetAll(){
  if(!confirm('Reset semua centang dan muat ulang template untuk QC berikutnya?'))return;
  checked={};
  sections=JSON.parse(JSON.stringify(template));
  sections.forEach(s=>s.open=true);
  document.getElementById('custName').value='';
  renderAll();
}

// ── HISTORY ───────────────────────────
function saveToHistory(){
  const custName=document.getElementById('custName').value.trim()||'Tanpa Nama';
  const tot=totalItems(),don=totalChecked();
  const entry={
    id:'h_'+Date.now(),
    customer:custName,
    date:new Date().toISOString(),
    total:tot,done:don,
    complete:don===tot,
    snapshot:JSON.parse(JSON.stringify(sections)),
    checked:JSON.parse(JSON.stringify(checked))
  };
  history.unshift(entry);
  saveHistStorage(history);
  updateHistBadge();
  alert(`QC "${custName}" berhasil disimpan ke History!`);
}

function updateHistBadge(){
  document.getElementById('histBadge').textContent=history.length;
}

function deleteHistory(id){
  if(!confirm('Hapus data QC ini dari history?'))return;
  history=history.filter(h=>h.id!==id);
  saveHistStorage(history);
  updateHistBadge();
  renderHistory();
}

function toggleHistPreview(id){
  const el=document.getElementById('hist-preview-'+id);
  if(!el)return;
  el.classList.toggle('open');
}

function renderHistory(){
  const container=document.getElementById('histMain');
  if(history.length===0){
    container.innerHTML=`<div class="hist-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <p>Belum ada history QC</p>
      <small>Selesaikan checklist lalu klik "Simpan ke History"</small>
    </div>`;
    return;
  }
  container.innerHTML='';
  history.forEach(entry=>{
    const d=new Date(entry.date);
    const dateStr=d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    const timeStr=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    const statusClass=entry.complete?'complete':'partial';
    const statusLabel=entry.complete?'✅ Lolos Semua':`⚠️ ${entry.done}/${entry.total} Lolos`;
    const card=document.createElement('div');
    card.className='hist-card';
    card.id='hist-card-'+entry.id;
    card.innerHTML=`
      <div class="hist-card-header">
        <div class="hist-status-dot ${statusClass}"></div>
        <div class="hist-info">
          <div class="hist-customer">${entry.customer}</div>
          <div class="hist-meta">
            <span>📅 ${dateStr}</span>
            <span>🕐 ${timeStr}</span>
            <span class="hist-badge ${statusClass}">${statusLabel}</span>
          </div>
        </div>
        <div class="hist-actions">
          <button class="hist-btn" onclick="toggleHistPreview('${entry.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            View
          </button>
          <button class="hist-btn dl" onclick="generatePDF('${entry.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            PDF
          </button>
          <button class="hist-btn danger" onclick="deleteHistory('${entry.id}')" title="Hapus">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </div>
      <div class="hist-divider"></div>
      <div class="hist-preview" id="hist-preview-${entry.id}">
        ${renderHistPreview(entry)}
      </div>`;
    container.appendChild(card);
  });
}

function renderHistPreview(entry){
  return entry.snapshot.map(sec=>{
    const items=sec.items.map(item=>{
      const isC=!!entry.checked[item.id];
      return `<div class="hist-preview-item${isC?' checked':''}">
        <div class="hist-check-icon${isC?' done':' undone'}">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span>${item.label}</span>
      </div>`;
    }).join('');
    return `<div class="hist-preview-sec">
      <div class="hist-preview-sec-name">${sec.icon} ${sec.name}</div>
      ${items}
    </div>`;
  }).join('');
}

// ── RENDER CHECKLIST ─────────────────
function makeItemEl(item,secId){
  const li=document.createElement('li');
  li.className='item'+(checked[item.id]?' checked':'');
  li.id='item-'+item.id;
  li.innerHTML=`
    <div class="checkbox${checked[item.id]?' checked':''}" onclick="toggleItem('${item.id}','${secId}')">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="item-text">
      <div class="item-label">${item.label}</div>
      ${item.sub?`<div class="item-sub">${item.sub}</div>`:''}
    </div>
    <button class="del-btn" onclick="deleteItem('${item.id}','${secId}')" title="Hapus">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>`;
  return li;
}

function renderAll(){
  const main=document.getElementById('main');
  main.innerHTML='';
  sections.forEach(sec=>{
    const tot=sec.items.length,don=sec.items.filter(i=>checked[i.id]).length;
    const pct=tot?Math.round(don/tot*100):0;
    const div=document.createElement('div');
    div.className='section';div.id='sec-'+sec.id;
    const isOpen=sec.open!==false;
    div.innerHTML=`
      <div class="sec-header" onclick="toggleSec('${sec.id}')">
        <div class="sec-left">
          <span class="sec-icon">${sec.icon}</span>
          <span class="sec-name">${sec.name}</span>
        </div>
        <span class="sec-count">${don}/${tot}</span>
        <span class="sec-chevron${isOpen?' open':''}">▾</span>
      </div>
      <div class="sec-prog"><div class="sec-prog-fill" style="width:${pct}%"></div></div>
      <div class="sec-body${isOpen?' open':''}">
        <ul class="items" id="list-${sec.id}"></ul>
        <div class="add-row">
          <input type="text" id="inp-${sec.id}" placeholder="Tambah item baru..." onkeydown="if(event.key==='Enter')addItem('${sec.id}')">
          <button onclick="addItem('${sec.id}')">+ Tambah</button>
        </div>
      </div>`;
    const list=div.querySelector('#list-'+sec.id);
    sec.items.forEach(item=>list.appendChild(makeItemEl(item,sec.id)));
    main.appendChild(div);
  });
  updateProgress();
}

// ── TEMPLATE MODAL ────────────────────
function openTemplate(){
  tplDraft=JSON.parse(JSON.stringify(template));
  renderTplModal();
  document.getElementById('tplOverlay').className='overlay show';
}
function closeTemplate(){document.getElementById('tplOverlay').className='overlay';tplDraft=null;}
function saveTemplate(){
  tplDraft.forEach(sec=>{
    const n=document.getElementById('tpl-name-'+sec.id);
    const ic=document.getElementById('tpl-icon-'+sec.id);
    if(n)sec.name=n.value.trim()||sec.name;
    if(ic)sec.icon=ic.value.trim()||sec.icon;
  });
  template=JSON.parse(JSON.stringify(tplDraft));
  saveTplStorage(template);
  closeTemplate();
  alert('Template disimpan! Akan digunakan saat QC Baru.');
}

function renderTplModal(){
  const body=document.getElementById('tplBody');
  body.innerHTML='';
  tplDraft.forEach(sec=>{
    const block=document.createElement('div');
    block.className='tpl-section-block';block.id='tpl-block-'+sec.id;
    block.innerHTML=`
      <div class="tpl-sec-header">
        <input class="tpl-sec-icon-input" id="tpl-icon-${sec.id}" type="text" value="${sec.icon}" maxlength="2" title="Ganti ikon (emoji)">
        <input class="tpl-sec-name-input" id="tpl-name-${sec.id}" type="text" value="${sec.name}" placeholder="Nama seksi...">
        <button class="tpl-del-sec" onclick="tplDeleteSection('${sec.id}')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
          Hapus seksi
        </button>
      </div>
      <ul class="tpl-items-list" id="tpl-list-${sec.id}"></ul>
      <div class="tpl-add">
        <input type="text" id="tpl-inp-${sec.id}" placeholder="Tambah item..." onkeydown="if(event.key==='Enter')tplAddItem('${sec.id}')">
        <button onclick="tplAddItem('${sec.id}')">+ Tambah</button>
      </div>`;
    const list=block.querySelector('#tpl-list-'+sec.id);
    sec.items.forEach(item=>list.appendChild(makeTplItemEl(item,sec.id)));
    body.appendChild(block);
  });
  const addBtn=document.createElement('button');
  addBtn.className='add-section-btn';
  addBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Tambah Seksi Baru`;
  addBtn.onclick=tplAddSection;
  body.appendChild(addBtn);
}

function makeTplItemEl(item,secId){
  const li=document.createElement('li');
  li.className='tpl-item';li.id='tpl-item-'+item.id;
  li.innerHTML=`<span class="tpl-item-label">${item.label}</span>
    <button class="tpl-del-item" onclick="tplDeleteItem('${item.id}','${secId}')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>`;
  return li;
}
function tplDeleteItem(itemId,secId){
  const sec=tplDraft.find(s=>s.id===secId);
  sec.items=sec.items.filter(i=>i.id!==itemId);
  document.getElementById('tpl-item-'+itemId)?.remove();
}
function tplAddItem(secId){
  const inp=document.getElementById('tpl-inp-'+secId);
  const label=inp.value.trim();if(!label)return;
  const sec=tplDraft.find(s=>s.id===secId);
  const newId=secId+'_t_'+Date.now();
  sec.items.push({id:newId,label,sub:''});
  document.getElementById('tpl-list-'+secId).appendChild(makeTplItemEl({id:newId,label,sub:''},secId));
  inp.value='';inp.focus();
}
function tplDeleteSection(secId){
  if(!confirm('Hapus seksi ini dari template?'))return;
  tplDraft=tplDraft.filter(s=>s.id!==secId);
  document.getElementById('tpl-block-'+secId)?.remove();
}
function tplAddSection(){
  tplDraft.forEach(sec=>{
    const n=document.getElementById('tpl-name-'+sec.id);
    const ic=document.getElementById('tpl-icon-'+sec.id);
    if(n)sec.name=n.value.trim()||sec.name;
    if(ic)sec.icon=ic.value.trim()||sec.icon;
  });
  const newId='sec_'+Date.now();
  const icon=ICONS[tplDraft.length%ICONS.length];
  tplDraft.push({id:newId,icon,name:'Seksi Baru',items:[]});
  const body=document.getElementById('tplBody');
  const addBtn=body.querySelector('.add-section-btn');
  const block=document.createElement('div');
  block.className='tpl-section-block';block.id='tpl-block-'+newId;
  block.innerHTML=`
    <div class="tpl-sec-header">
      <input class="tpl-sec-icon-input" id="tpl-icon-${newId}" type="text" value="${icon}" maxlength="2">
      <input class="tpl-sec-name-input" id="tpl-name-${newId}" type="text" value="Seksi Baru" placeholder="Nama seksi...">
      <button class="tpl-del-sec" onclick="tplDeleteSection('${newId}')">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
        Hapus seksi
      </button>
    </div>
    <ul class="tpl-items-list" id="tpl-list-${newId}"></ul>
    <div class="tpl-add">
      <input type="text" id="tpl-inp-${newId}" placeholder="Tambah item..." onkeydown="if(event.key==='Enter')tplAddItem('${newId}')">
      <button onclick="tplAddItem('${newId}')">+ Tambah</button>
    </div>`;
  body.insertBefore(block,addBtn);
  block.querySelector('.tpl-sec-name-input').focus();
  block.querySelector('.tpl-sec-name-input').select();
}

// ── PDF ───────────────────────────────
function generatePDF(histId){
  let snap, chk, custName, dateObj;
  if(histId){
    const entry=history.find(h=>h.id===histId);
    if(!entry)return;
    snap=entry.snapshot; chk=entry.checked;
    custName=entry.customer; dateObj=new Date(entry.date);
  } else {
    snap=sections; chk=checked;
    custName=document.getElementById('custName').value.trim()||'—';
    dateObj=new Date();
  }
  const tot=snap.reduce((s,sec)=>s+sec.items.length,0);
  const don=snap.reduce((s,sec)=>s+sec.items.filter(i=>chk[i.id]).length,0);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const margin=20,contentW=170;
  let y=margin;

  doc.setFillColor(107,26,42);doc.rect(0,0,210,42,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('WONDERGIFT88',margin,14);
  doc.setFontSize(18);doc.setFont('helvetica','bold');
  doc.text('Summary QC Checklist',margin,24);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.setTextColor(220,190,180);
  doc.text('Quality Control — Standar Produksi',margin,32);
  y=52;

  const dateStr=dateObj.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  const timeStr=dateObj.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

  doc.setFillColor(245,238,233);doc.roundedRect(margin,y,contentW,24,3,3,'F');
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(122,96,85);
  doc.text('CUSTOMER',margin+6,y+7);doc.text('TANGGAL',margin+70,y+7);
  doc.text('WAKTU',margin+120,y+7);doc.text('HASIL',margin+155,y+7);
  doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(42,26,20);
  doc.text(custName,margin+6,y+16);doc.text(dateStr,margin+70,y+16);
  doc.text(timeStr,margin+120,y+16);
  doc.setTextColor(don===tot?58:180,don===tot?107:140,don===tot?69:50);
  doc.text(`${don}/${tot} LOLOS`,margin+155,y+16);
  y+=32;

  snap.forEach(sec=>{
    if(y>262){doc.addPage();y=margin;}
    doc.setFillColor(245,238,233);doc.rect(margin,y,contentW,8,'F');
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(107,26,42);
    doc.text(sec.name.toUpperCase(),margin+4,y+5.5);
    const sD=sec.items.filter(i=>chk[i.id]).length;
    doc.setFont('helvetica','normal');doc.setTextColor(122,96,85);
    doc.text(`${sD}/${sec.items.length}`,margin+contentW-4,y+5.5,{align:'right'});
    y+=10;
    sec.items.forEach((item,idx)=>{
      if(y>272){doc.addPage();y=margin;}
      const isC=!!chk[item.id];
      doc.setFillColor(idx%2===0?255:250,idx%2===0?255:246,idx%2===0?255:240);
      doc.rect(margin,y,contentW,7,'F');
      doc.setDrawColor(212,196,186);doc.setLineWidth(0.4);
      if(isC){
        doc.setFillColor(107,26,42);doc.roundedRect(margin+3,y+1.5,4,4,0.8,0.8,'FD');
        doc.setDrawColor(255,255,255);doc.setLineWidth(0.6);
        doc.line(margin+4,y+3.5,margin+5,y+4.8);doc.line(margin+5,y+4.8,margin+6.5,y+2.5);
      } else {
        doc.setFillColor(255,255,255);doc.roundedRect(margin+3,y+1.5,4,4,0.8,0.8,'FD');
      }
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      doc.setTextColor(isC?160:42,isC?130:26,isC?120:20);
      doc.text(item.label,margin+10,y+4.8);
      y+=7;
    });
    y+=4;
  });

  if(y>272){doc.addPage();y=margin;}
  doc.setDrawColor(212,196,186);doc.setLineWidth(0.4);doc.line(margin,y,margin+contentW,y);y+=5;
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(180,160,150);
  doc.text('Wondergift88 — Dokumen QC Internal',margin,y);
  doc.text(`Dicetak: ${new Date().toLocaleDateString('id-ID')}`,margin+contentW,y,{align:'right'});

  const safeName=custName.replace(/[^a-zA-Z0-9\s]/g,'').replace(/\s+/g,'_')||'Customer';
  doc.save(`QC_Wondergift88_${safeName}_${dateObj.toISOString().slice(0,10)}.pdf`);
}

// ── INIT ─────────────────────────────
sections.forEach(s=>s.open=true);
renderAll();
updateHistBadge();
</script>
